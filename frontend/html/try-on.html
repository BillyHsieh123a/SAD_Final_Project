<!DOCTYPE html>
<html lang="en">    
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Try-On - Polaritique</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='/css/global.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='/css/try-on.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">
      <a href="category"><h1>Polaritique</h1></a>
    </div>
    <button class="go-back-btn" onclick="window.history.back();">Go Back</button>
    <div class="icons">
      <i class="fas fa-user" id="profile-icon"></i>
      <i class="fas fa-heart" id="like-icon"></i>
      <i class="fas fa-shopping-bag" id="bag-icon"></i>
    </div>
  </header>

  <!-- Main Layout -->
  <main>
    <section class="try-on-layout">
      <div class="top-section">
        <!-- 左側 Top 和 Bottom 分欄 -->
        <div class="left-column">
          <!-- Top 區塊 -->
          <div class="favorite-section">
            <div class="upload-area">
              <label for="upload-top" class="upload-btn">Upload</label>
              <input type="file" id="upload-top" accept="image/*" />
            </div>
            <div class="section-label"><strong>Top</strong></div>
            <div class="item-list" id="top-list"></div>
          </div>

          <!-- Bottom 區塊 -->
          <div class="favorite-section">
            <div class="upload-area">
              <label for="upload-bottom" class="upload-btn">Upload</label>
              <input type="file" id="upload-bottom" accept="image/*" />
            </div>
            <div class="section-label"><strong>Bottom</strong></div>
            <div class="item-list" id="bottom-list"></div>
          </div>
        </div>

        <!-- 右側 AI 結果 -->
        <div class="right-panel">
          <div class="upload-area-right">
            <label for="upload-right" class="upload-btn">Upload</label>
            <input type="file" id="upload-right" accept="image/*" />
          </div>
          <div class="result-display">
            <h3>Result</h3>
            <img id="processed-image" src="" alt="AI Processed Image" />
          </div>
          <div class="ai-comment">
            <h3>AI Comment</h3>
            <p id="ai-comment-text">Try something bold! This top suits you well.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <p>&copy; 2024 Polaritique. All rights reserved.</p>
      <div class="footer-links">
        <a href="about">About Us</a>
        <a href="contact">Contact</a>
        <a href="privacy-policy">Privacy Policy</a>
        <a href="terms">Terms & Conditions</a>
      </div>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='/js/global.js') }}"></script>
  <script src="{{ url_for('static', filename='/js/try-on.js') }}"></script>
</body>
</html>
